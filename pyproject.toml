[project]
name = "fileswapper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tf4482", email = "tf4482@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fileswapper = "fileswapper:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["utils_python"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.pyright]
pythonVersion = "3.12"
exclude = [
    "**/utils_python",
    "**/.venv",
    "**/.pytest_cache",
    "**/node_modules",
    "**/__pycache__",
    "**/.ruff_cache",
    "**/.*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.3",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
